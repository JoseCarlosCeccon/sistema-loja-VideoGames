spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:../data/acaogames.db?busy_timeout=5000&foreign_keys=on&journal_mode=WAL}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  jackson:
    default-property-inclusion: non_null
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

app:
  default-user-id: ${APP_DEFAULT_USER_ID:1}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
